name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      docs-only: ${{ steps.check.outputs.docs-only }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for docs-only changes
        id: check
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BASE="${{ github.event.before }}"
          fi
          DOCS_ONLY=false
          if [ -n "$BASE" ] && CHANGED=$(git diff --name-only "$BASE" HEAD); then
            if [ -n "$CHANGED" ] && ! echo "$CHANGED" | grep -qv "^docs/"; then
              DOCS_ONLY=true
            fi
          fi
          echo "docs-only=$DOCS_ONLY" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.docs-only != 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Types
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  ci:
    if: always()
    runs-on: ubuntu-latest
    needs: [changes, build]

    steps:
      - name: Check results
        run: |
          [ "${{ needs.changes.result }}" = "success" ] || exit 1
          [ "${{ needs.build.result }}" = "success" ] || [ "${{ needs.build.result }}" = "skipped" ]
