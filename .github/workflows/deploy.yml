name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - preview
      d1_database_id:
        description: 'D1 数据库 ID（留空则用默认/Secrets，现有库 cs2-inventory-db 的 ID 为 b7653ae2-637e-409a-8578-9649e9abcf7b）'
        required: false
        default: ''
        type: string
      kv_namespace_id:
        description: 'KV 命名空间 ID（留空则用默认/Secrets，现有 cs2-inventory-kv 的 ID 为 ee21da70ae014021881c1249bc6d0451）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Wrangler
        run: npm install -g wrangler@4.127.1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Authenticate with Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      - name: Resolve D1 / KV resource IDs
        id: resources
        env:
          D1_INPUT: ${{ github.event.inputs.d1_database_id || '' }}
          KV_INPUT: ${{ github.event.inputs.kv_namespace_id || '' }}
          D1_SECRET: ${{ secrets.D1_DATABASE_ID }}
          KV_SECRET: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          # 优先级：工作流输入 > Secrets > 默认（现有资源）
          D1_ID="${D1_INPUT:-${D1_SECRET:-b7653ae2-637e-409a-8578-9649e9abcf7b}}"
          KV_ID="${KV_INPUT:-${KV_SECRET:-ee21da70ae014021881c1249bc6d0451}}"
          DB_NAME="cs2-inventory-db"
          echo "d1_database_id=$D1_ID" >> "$GITHUB_OUTPUT"
          echo "kv_namespace_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          echo "使用 D1=$DB_NAME ($D1_ID)  kv=CACHE ($KV_ID)"

      - name: Generate wrangler config
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "cs2-cfworker-inventory-simulator",
            "main": "./workers/app.ts",
            "compatibility_date": "2025-08-01",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "./build/client",
              "binding": "ASSETS"
            },
            "observability": { "enabled": true },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "${{ steps.resources.outputs.db_name }}",
                "database_id": "${{ steps.resources.outputs.d1_database_id }}",
                "migrations_dir": "./d1-migrations"
              }
            ],
            "kv_namespaces": [
              {
                "binding": "CACHE",
                "id": "${{ steps.resources.outputs.kv_namespace_id }}"
              }
            ],
            "vars": { "NODE_ENV": "production" },
            "routes": [
              { "pattern": "clc.ccwu.cc", "custom_domain": true }
            ]
          }
          EOF

      - name: Build project
        run: npm run build

      - name: Apply D1 migrations
        run: |
          wrangler d1 migrations apply "${{ steps.resources.outputs.db_name }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Workers
        run: |
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_CALLBACK_URL: ${{ secrets.STEAM_CALLBACK_URL }}

      - name: Comment deployment URL
        if: github.event_name == 'push'
        run: |
          WORKER_URL="https://cs2-cfworker-inventory-simulator.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "🚀 部署完成！访问: $WORKER_URL"
          echo "📝 别忘了在 Steam 应用管理页设置 Redirect URI: $WORKER_URL/sign-in/steam/callback"
