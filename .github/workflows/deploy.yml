name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - preview
      d1_database_id:
        description: 'D1 数据库 ID（留空则用默认/Secrets，现有库 cs2-inventory-db 的 ID 为 b7653ae2-637e-409a-8578-9649e9abcf7b）'
        required: false
        default: ''
        type: string
      kv_namespace_id:
        description: 'KV 命名空间 ID（留空则用默认/Secrets，现有 cs2-inventory-kv 的 ID 为 ee21da70ae014021881c1249bc6d0451）'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Wrangler
        run: npm install -g wrangler@4.127.1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Authenticate with Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: whoami

      - name: Resolve D1 / KV resource IDs
        id: resources
        env:
          D1_INPUT: ${{ github.event.inputs.d1_database_id || '' }}
          KV_INPUT: ${{ github.event.inputs.kv_namespace_id || '' }}
          D1_SECRET: ${{ secrets.D1_DATABASE_ID }}
          KV_SECRET: ${{ secrets.KV_NAMESPACE_ID }}
        run: |
          set -euo pipefail
          # 优先级：工作流输入 > Secrets > 默认（现有资源）
          D1_ID="${D1_INPUT:-${D1_SECRET:-b7653ae2-637e-409a-8578-9649e9abcf7b}}"
          KV_ID="${KV_INPUT:-${KV_SECRET:-ee21da70ae014021881c1249bc6d0451}}"
          DB_NAME="cs2-inventory-db"
          echo "d1_database_id=$D1_ID" >> "$GITHUB_OUTPUT"
          echo "kv_namespace_id=$KV_ID" >> "$GITHUB_OUTPUT"
          echo "db_name=$DB_NAME" >> "$GITHUB_OUTPUT"
          echo "使用 D1=$DB_NAME ($D1_ID)  kv=CACHE ($KV_ID)"

      - name: Generate wrangler config
        run: |
          cat > wrangler.jsonc <<EOF
          {
            "\$schema": "node_modules/wrangler/config-schema.json",
            "name": "cs2-cfworker-inventory-simulator",
            "main": "./workers/app.ts",
            "compatibility_date": "2025-08-01",
            "compatibility_flags": ["nodejs_compat"],
            "assets": {
              "directory": "./build/client",
              "binding": "ASSETS"
            },
            "observability": { "enabled": true },
            "d1_databases": [
              {
                "binding": "DB",
                "database_name": "${{ steps.resources.outputs.db_name }}",
                "database_id": "${{ steps.resources.outputs.d1_database_id }}",
                "migrations_dir": "./d1-migrations"
              }
            ],
            "kv_namespaces": [
              {
                "binding": "CACHE",
                "id": "${{ steps.resources.outputs.kv_namespace_id }}"
              }
            ],
            "vars": { "NODE_ENV": "production" },
            "secrets": {
              "required": ["SESSION_SECRET", "STEAM_API_KEY", "STEAM_CALLBACK_URL"]
            },
            "routes": [
              { "pattern": "clc.ccwu.cc", "custom_domain": true }
            ]
          }
          EOF

      - name: Build project
        run: npm run build

      - name: Apply D1 migrations
        run: |
          wrangler d1 migrations apply "${{ steps.resources.outputs.db_name }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Set Cloudflare secrets (before deploy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_CALLBACK_URL: ${{ secrets.STEAM_CALLBACK_URL }}
        run: |
          set -euo pipefail
          SCRIPT="cs2-cfworker-inventory-simulator"
          put_secret() {
            [ -n "$2" ] || return 0
            local payload
            payload=$(python3 -c 'import json,sys; print(json.dumps({"type":"secret_text","name":sys.argv[1],"text":sys.argv[2]}))' "$1" "$2")
            curl -sS -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/${SCRIPT}/secrets" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$payload" \
              | python3 -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("success") else 1)' \
                || { echo "failed to set secret $1"; exit 1; }
            echo "secret $1 set"
          }
          put_secret SESSION_SECRET "$SESSION_SECRET"
          put_secret STEAM_API_KEY "$STEAM_API_KEY"
          put_secret STEAM_CALLBACK_URL "$STEAM_CALLBACK_URL"

      - name: Deploy to Cloudflare Workers
        run: |
          wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_CALLBACK_URL: ${{ secrets.STEAM_CALLBACK_URL }}

      - name: Ensure active deployment has full bindings
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          acct = os.environ["CLOUDFLARE_ACCOUNT_ID"]
          token = os.environ["CLOUDFLARE_API_TOKEN"]
          script = "cs2-cfworker-inventory-simulator"
          base = f"https://api.cloudflare.com/client/v4/accounts/{acct}/workers/scripts/{script}"

          deps = json.loads(subprocess.run(
              ["curl", "-s", "-H", f"Authorization: Bearer {token}", f"{base}/deployments"],
              capture_output=True, text=True, check=True).stdout)["result"]["deployments"]

          def version(version_id):
              r = json.loads(subprocess.run(
                  ["curl", "-s", "-H", f"Authorization: Bearer {token}", f"{base}/versions/{version_id}"],
                  capture_output=True, text=True, check=True).stdout)
              return r.get("result", {}).get("resources", {}).get("bindings", [])

          candidate = None
          latest_deploy = deps[0]
          for dep in deps:
              vid = dep["versions"][0]["version_id"]
              b = version(vid)
              types = {x.get("type") for x in b}
              names = {x.get("name") for x in b}
              if "d1" in types and "kv_namespace" in types and "assets" in types and "SESSION_SECRET" in names:
                  candidate = vid
                  if dep is latest_deploy:
                      print(f"最新 deployment 已含完整绑定: {vid[:8]} (deployment {dep['id'][:8]})")
                  else:
                      print(f"最新 deployment 缺少绑定，回退到历史完整版本: {vid[:8]} (deployment {dep['id'][:8]})")
                  break
          if candidate is None:
              print("WARNING: 未找到完整绑定版本，跳过修复（请人工检查）")
              exit(1)

          if latest_deploy["versions"][0]["version_id"] == candidate:
              print("当前 active 已是完整绑定版本，无需修复")
              exit(0)

          payload = json.dumps({
              "strategy": "percentage",
              "versions": [{"percentage": 100, "version_id": candidate}]
          })
          resp = subprocess.run(
              ["curl", "-s", "-X", "POST", "-H", f"Authorization: Bearer {token}",
               "-H", "Content-Type: application/json", "-d", payload, f"{base}/deployments"],
              capture_output=True, text=True, check=True).stdout
          data = json.loads(resp)
          if not data.get("success"):
              print("重建 active deployment 失败:", data.get("errors"))
              exit(1)
          print("已重建 active deployment → 100% 指向完整绑定版本", candidate[:8])
          PY

      - name: Comment deployment URL
        if: github.event_name == 'push'
        run: |
          WORKER_URL="https://cs2-cfworker-inventory-simulator.${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.workers.dev"
          echo "🚀 部署完成！访问: $WORKER_URL"
          echo "📝 别忘了在 Steam 应用管理页设置 Redirect URI: $WORKER_URL/sign-in/steam/callback"
